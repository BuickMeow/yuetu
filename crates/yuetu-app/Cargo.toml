[package]
name = "yuetu-app"
description = "Yuetu desktop application (egui + wgpu)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "yuetu"
path = "src/main.rs"

[dependencies]
yuetu-core = { workspace = true }
yuetu-vector = { workspace = true }
bytemuck = { workspace = true }
eframe = { workspace = true }
egui = { workspace = true }
egui_extras = { workspace = true }
egui_material_icons = { workspace = true }
rayon = "1"
rfd = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
vello_gpu = "0.3"

[package.metadata.bundle]
name = "Yuetu"
identifier = "com.jieneng.yuetu"
copyright = "Copyright (c) Jieneng 2026"
category = "Music"
short_description = "Turn images and vector documents into a MIDI piano roll."
long_description = "Yuetu converts images, GIF/WebP animations and vector documents into MIDI piano-roll notes."
