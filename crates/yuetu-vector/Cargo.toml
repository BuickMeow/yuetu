[package]
name = "yuetu-vector"
description = "Vector document loading and rasterization for Yuetu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
hayro = "0.8"
resvg = "0.49"
stet = { version = "0.8", default-features = false, features = ["render"] }
thiserror.workspace = true
usvg = "0.49"
vello_common = "0.3"
vello_gpu = "0.3"
yuetu-core = { workspace = true }

[dev-dependencies]
wgpu = { version = "30", default-features = false, features = ["std", "wgsl"] }
pollster = "0.4"
