<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-labelledby="title desc">
  <title id="title">月兔</title>
  <desc id="desc">一只侧面坐着的兔子，由圆、圆的交集与镂空构成的单色几何图标。</desc>

  <defs>
    <!-- 耳朵：两个大圆的交集形成长而尖的耳形 -->
    <clipPath id="ear-left"><circle cx="499.67" cy="211.24" r="241.92"/></clipPath>
    <clipPath id="ear-right"><circle cx="708.05" cy="268.88" r="262.04"/></clipPath>

    <!-- 内耳：同样以圆的交集挖空 -->
    <clipPath id="inner-ear-left"><circle cx="589.84" cy="193.71" r="286.78"/></clipPath>
    <clipPath id="inner-ear-right"><circle cx="830.80" cy="297.22" r="339.03"/></clipPath>

    <mask id="rabbit-holes" maskUnits="userSpaceOnUse" maskContentUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <circle cx="512" cy="512" r="740" fill="#fff"/>
      <g clip-path="url(#inner-ear-left)"><circle cx="62.16" cy="296.29" r="286.78" fill="#000"/></g>
      <g clip-path="url(#inner-ear-right)"><circle cx="205.20" cy="152.78" r="339.03" fill="#000"/></g>
    </mask>
  </defs>

  <g fill="#5EEAD4" mask="url(#rabbit-holes)">
    <g clip-path="url(#ear-left)"><circle cx="152.33" cy="278.76" r="241.92"/></g>
    <g clip-path="url(#ear-right)"><circle cx="327.95" cy="181.12" r="262.04"/></g>

    <circle cx="406" cy="470" r="135"/>
    <circle cx="281" cy="505" r="66"/>

    <circle cx="445" cy="590" r="135"/>
    <circle cx="565" cy="740" r="195"/>

    <circle cx="790" cy="710" r="45"/>
    <circle cx="390" cy="895" r="68"/>
  </g>
</svg>
